# GPSD Web UI Configuration
#
# Environment variables override config.yaml values:
#   GPSD_HOST, GPSD_PORT, NTP_ENABLED, NTP_HOST, NTP_INTERVAL,
#   WEB_HOST, WEB_PORT, LOG_LEVEL

log_level: INFO  # DEBUG, INFO, WARNING, ERROR

gpsd:
  host: localhost
  port: 2947

ntp:
  enabled: false
  host: ntp.ubuntu.com
  interval: 5

web:
  host: 0.0.0.0
  port: 5000
