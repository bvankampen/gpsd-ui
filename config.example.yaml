# GPSD Web UI Configuration
#
# Environment variables override config.yaml values:
#   GPSD_HOST, GPSD_PORT, GPSD_STALL_TIMEOUT, NTP_ENABLED, NTP_HOST,
#   UPDATE_INTERVAL, WEB_HOST, WEB_PORT, LOG_LEVEL

log_level: INFO  # DEBUG, INFO, WARNING, ERROR

update_interval: 1  # seconds - shared by GPS and NTP

gpsd:
  host: localhost
  port: 2947
  stall_timeout: 30  # seconds without gpsd data before reconnecting

ntp:
  enabled: false
  host: ntp.ubuntu.com

web:
  host: 0.0.0.0
  port: 5000
  # Optional comma-separated origins for cross-origin Socket.IO clients.
  # Leave unset to allow same-origin clients only.
  # cors_allowed_origins: https://dashboard.example.com
